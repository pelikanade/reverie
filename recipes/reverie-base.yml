# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: nix
    source: local
    settings:
      # The CN mirrors sit ahead of cache.nixos.org, which still serves the
      # fresh paths they have not picked up yet.
      substituters:
        - https://mirrors.tuna.tsinghua.edu.cn/nix-channels/store
        - https://mirror.sjtu.edu.cn/nix-channels/store
        - https://cache.nixos.org
      extra-substituters:
        - https://nix-community.cachix.org
      extra-trusted-public-keys:
        - nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - https://cli.github.com/packages/rpm/gh-cli.repo
    install:
      packages:
        - fish
        - gh
        - terra-release
        - starship
        - ghostty
        - zed
        - neovim
        - ripgrep
        - atuin
        - zoxide
        - lazygit
        - ibus-rime
        - librime-lua
        - tela-icon-theme
        - loupe
        - gnome-tweaks
        - kleopatra
        - direnv
        # The FUSE 2 runtime AppImages mount themselves with.
        - fuse-libs
        - eza
        - fastfetch
        - du-dust
        - duf
        - fzf
        - fd-find
        - git-lfs
        - tailscale
        - localsend-bin
        - https://downloads.1password.com/linux/rpm/stable/x86_64/1password-latest.rpm
        - https://downloads.1password.com/linux/rpm/stable/x86_64/1password-cli-latest.x86_64.rpm
    remove:
      packages:
        - nvtop

  - type: script
    scripts:
      - rime-ice.sh
      - sing-box-sfl.sh
      - magpie.sh

  - type: systemd
    system:
      enabled:
        - tailscaled.service
        - sing-box-daemon.service
    user:
      enabled:
        - tailscale-systray.service

  - type: hjem
    source: local
    flake: github:pelikanade/reverie

  - type: justfiles
    validate: true

  - type: default-flatpaks
    configurations:
      - install:
          - com.tencent.wemeet
          - org.telegram.desktop

  - type: gnome-extensions
    install:
      - 615 # AppIndicator and KStatusNotifierItem Support
      - 3193 # Blur my Shell
      - 517 # Caffeine
      - 4839 # Clipboard History
      - 6807 # System Monitor
      - 307 # Dash to Dock
      - 7065 # Tiling Shell

  - type: gschema-overrides
    include:
      - zz1-gnome.gschema.override

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode

  - type: signing
