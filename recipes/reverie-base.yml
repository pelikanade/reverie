# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: nix
    source: local
    settings:
      substituters:
        - https://mirrors.tuna.tsinghua.edu.cn/nix-channels/store
        - https://mirror.sjtu.edu.cn/nix-channels/store
        - https://cache.nixos.org
      extra-substituters:
        - https://nix-community.cachix.org
      extra-trusted-public-keys:
        - nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - https://cli.github.com/packages/rpm/gh-cli.repo
        - grok-bot.repo
    install:
      packages:
        - fish
        - gh
        - terra-release
        - starship
        - grok-bot
        - ghostty
        - xdg-terminal-exec
        - zed
        - neovim
        - ripgrep
        - atuin
        - zoxide
        - lazygit
        - ibus-rime
        - librime-lua
        - tela-icon-theme
        - loupe
        - gnome-tweaks
        - kleopatra
        - webkit2gtk4.1
        - direnv
        - fuse-libs
        - eza
        - fastfetch
        - du-dust
        - duf
        - fzf
        - fd-find
        - git-lfs
        - tailscale
        - localsend-bin
        - zen-browser
        - https://downloads.1password.com/linux/rpm/stable/x86_64/1password-latest.rpm
        - https://downloads.1password.com/linux/rpm/stable/x86_64/1password-cli-latest.x86_64.rpm
    remove:
      packages:
        - nvtop
        - gnome-terminal
        - firefox
        - firefox-langpacks
        - ptyxis

  - type: install-binary
    source: local
    binaries:
      magpie:
        url: https://github.com/yetone/magpie-releases/releases/latest/download/magpie-linux-amd64
        icon: https://usemagpie.ai/img/icon-256.png
      omp: https://github.com/can1357/oh-my-pi/releases/latest/download/omp-linux-x64

  - type: script
    scripts:
      - rime-ice.sh
      - sing-box-sfl.sh

  - type: systemd
    system:
      enabled:
        - tailscaled.service
        - sing-box-daemon.service
    user:
      enabled:
        - tailscale-systray.service

  - type: hjem
    source: local
    flake: github:pelikanade/reverie

  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.mattjakeman.ExtensionManager
          - com.tencent.wemeet
          - org.telegram.desktop

  - type: gnome-extensions
    install:
      - 615 # AppIndicator and KStatusNotifierItem Support
      - 3193 # Blur my Shell
      - 517 # Caffeine
      - 4839 # Clipboard History
      - 6807 # System Monitor
      - 307 # Dash to Dock

  - type: gschema-overrides
    include:
      - zz1-gnome.gschema.override

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode

  - type: signing
